name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Pin the toolchain so CI reproduces the exact state the author verified
      # locally (moon 0.1.20260713 / moonc v0.10.4+2cc641edf). Formatter output
      # differs between toolchain versions, so an unpinned `moon fmt --check`
      # fails for cosmetic reasons unrelated to the code.
      - uses: hustcer/setup-moonbit@v1.22
        with:
          version: 0.10.4+2cc641edf
      - name: Toolchain
        run: moon version --all
      - name: Resolve dependencies
        run: moon update
      - name: Format
        run: moon fmt --check
      - name: Public API
        run: moon info
      - name: Strict check (wasm, wasm-gc, js, native)
        run: moon check --target all --deny-warn
      - name: Strict tests (wasm, wasm-gc, js, native)
        run: moon test --target all --deny-warn
      - name: Package manifest
        run: moon package --list
