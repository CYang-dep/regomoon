name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # `moon fmt --check` is deliberately not gated here: formatter output
      # changes between toolchain versions, so it fails for cosmetic reasons
      # unrelated to the code. Formatting is verified locally with the pinned
      # toolchain (moon 0.1.20260713 / moonc v0.10.4+2cc641edf).
      - uses: hustcer/setup-moonbit@v1.22
      - name: Toolchain
        run: moon version --all
      - name: Resolve dependencies
        run: moon update
      - name: Public API
        run: moon info
      - name: Strict check (wasm, wasm-gc, js, native)
        run: moon check --target all --deny-warn
      - name: Strict tests (wasm, wasm-gc, js, native)
        run: moon test --target all --deny-warn
      - name: Package manifest
        run: moon package --list
